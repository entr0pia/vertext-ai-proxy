# ==========================================
# Vertex AI OpenAI Proxy 配置文件
# ==========================================

server:
  # 默认仅监听本地回环地址（127.0.0.1），杜绝局域网意外暴露
  host: "127.0.0.1"
  # 默认端口 8766
  port: 8766
  log_level: "info" # debug | info | warning | error

proxy:
  # 客户端鉴权 API Key 列表
  # ⚠️ 安全警告：启动时系统会强制校验！
  # 如果包含以下示例 Key 或为空，服务将拒绝启动。
  # 请复制为 config.local.yaml 并修改为您自己的私密 Key。
  api_keys:
    - "sk-change-this-to-your-own-secret-key"

  # 模型名自动补全（将 gemini-2.5-flash 补全为 google/gemini-2.5-flash）
  auto_prefix_model: true


  # 可选：连接 Google 时的本地出口代理（如本地 Clash 代理），留空则直连
  # http_proxy: "http://127.0.0.1:7890"

  # 可选：/v1/responses 后端模式（默认 auto）
  # - auto: 优先使用 Vertex AI 原生 Interactions API（服务端持久化状态），遇 403 权限不足时自动降级到本地内存态
  # - interactions: 强制使用 Vertex AI 原生 Interactions API（需服务账号具备 roles/aiplatform.user 权限）
  # - local: 仅使用 :generateContent + 本地内存态 ResponseStore
  # responses_backend: "auto"

  # 可选：/v1/responses 内存会话状态缓存上限与过期时间（秒，仅 local/降级模式生效）
  # response_store_max_items: 500
  # response_store_ttl_seconds: 3600

gcp:
  # 服务账号凭据 JSON 文件路径（放置在根目录即可）
  service_account_file: "service_account.json"

  # GCP 项目 ID（留空则自动从 service_account.json 解析）
  project_id: ""

  # 区域位置（推荐 global）
  location: "global"

  # 上游调用超时时间（秒）
  timeout_seconds: 120
