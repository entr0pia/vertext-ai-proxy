[project]
name = "vertext-ai-proxy"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "entr0pia", email = "30486766+entr0pia@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "google-auth>=2.62.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
vertext-ai-proxy = "vertext_ai_proxy:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1", "pytest-asyncio>=1.4.1"]
